<!-- Header Part -->
 {% load static %}
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Blogs</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
  </head>
<body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <div class="col-4 pt-1">
            <a class="blog-header-logo text-decoration-none fw-bold fs-2" href="/" 
              style="background: linear-gradient(90deg, #ff4d8d, #7b5cff, #00c9a7);
               -webkit-background-clip: text;
               -webkit-text-fill-color: transparent;">
              MyBlogSpace
            </a>
            <!-- <a class="blog-header-logo text-dark" href="/"><b>MyBlogSpace</b></a> -->
          </div>
          <div class="col-4">
            <form action="{% url 'search' %}" method="GET">
              <div class="input-group">
                <input class="form-control" type="text" name="keyword" placeholder="Enter search term..." aria-label="Enter search" >
                <button class="btn btn-warning" id="button-search" type="submit">Go !</button>
              </div>
            </form>
          </div>
          <div class="col-4 d-flex justify-content-end align-items-center">
            {% if not user.is_authenticated %}
            <a class="btn btn-sm btn-warning" href="{% url 'login' %}">Login</a> &nbsp;
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'register' %}">Register</a>
            {% else %}
            <span><a href="{% url 'dashboard' %}" class="btn btn-sm btn-outline-primary">Dashboard</a></span>
            &nbsp;
            <span><a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger">Logout</a></span>
            {% endif %}
          </div>
        </div>
      </header>

      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for cat in categories %}
          <a class="p-2 text-muted" href="{% url 'posts_by_category' cat.id %}">{{cat.category_name}}</a>
          {% endfor %}
        </nav>
      </div>


<!-- Main Part -->
{% block content %}

{% endblock %}

<!-- Footer Part -->


  <footer class="blog-footer text-center py-4 mt-5">
  <p class="text-decoration-none fw-bold fs-2 m-0" 
     style="background: linear-gradient(90deg, #ff4d8d, #7b5cff, #00c9a7);
     -webkit-background-clip: text;
     -webkit-text-fill-color: transparent;">
     MyBlogSpace
  </p>
  <p class="text-white-50 small mt-2 mb-0">
    © <span id="year"></span> MyBlogSpace. All rights reserved.
  </p>
</footer>

<script>
  function updateYear() {
    document.getElementById("year").textContent = new Date().getFullYear();
  }
  updateYear();
</script>

</body>
</html>
